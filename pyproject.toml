[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Distribution name only. The import stays `distributed_rate_limiter`:
# `distributed-rate-limiter` is already taken on PyPI by an unrelated project,
# and renaming the import to match would break every existing usage for
# nothing.
name = "drl-ratelimit"
dynamic = ["version"]
description = "Five rate limiting algorithms that stay correct across multiple server instances."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "grant-j-kim", email = "ggkim137@gmail.com" }]
keywords = [
    "rate-limiting",
    "rate-limiter",
    "redis",
    "fastapi",
    "asgi",
    "token-bucket",
    "leaky-bucket",
    "sliding-window",
    "distributed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The algorithms -- including the Redis-backed ones -- import nothing outside
# the standard library. A Redis limiter takes its client as a duck-typed
# argument, so redis-py is a dependency of the *application* that supplies
# one, not of this package.
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # packaging/verify_install.sh builds the wheel before installing it, so
    # this is needed for the packaging check to run on a fresh clone.
    "build>=1.0",
]
loadtest = ["matplotlib>=3.8"]
# What the hosted demo needs on top of the library. Leaves only -- deliberately
# *not* a self-reference to `drl-ratelimit[redis]`, which is unpublished, so uv
# would try to resolve it from PyPI and fail.
demo = ["redis>=5.0", "fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/grant-j-kim/distributed-rate-limiter"
Source = "https://github.com/grant-j-kim/distributed-rate-limiter"

[tool.vercel]
# Vercel finds two FastAPI apps in this repo (examples/ and packaging/) and
# refuses to guess. TEMPORARY: points at the algorithm demo server, which is
# import-safe with no Redis. Repoint at the web/ demo once it exists.
entrypoint = "examples.app:app"

[tool.vercel.scripts]
# Vercel installs dependencies with `uv sync --active --no-dev --no-editable`
# and passes no --extra, so [project.optional-dependencies] is NEVER installed
# -- a deploy would die on `ModuleNotFoundError: fastapi` with the `demo` extra
# declared and ignored. This hook runs *after* that default install and adds it.
# Use the build hook, not the install hook: a custom `install` script sets
# assumeDepsInstalled and REPLACES uv sync entirely.
vercel-build = "uv pip install '.[demo]'"

[tool.hatch.version]
path = "src/distributed_rate_limiter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_rate_limiter"]

[tool.hatch.build.targets.sdist]
# The load test rig and its recorded results are part of the project's
# evidence, not part of the library, so they ship in the sdist and stay out
# of the wheel.
include = [
    "src/distributed_rate_limiter",
    "tests",
    "loadtest",
    "examples",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Put src/ on sys.path directly rather than relying on the editable install's
# .pth file. On macOS that .pth can acquire the UF_HIDDEN flag, and Python
# 3.13's site.py silently skips hidden .pth files -- which breaks the import
# with no diagnostic. This keeps the suite runnable either way.
pythonpath = ["src", "."]
