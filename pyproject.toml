[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distributed-rate-limiter"
version = "0.1.0"
description = "Rate limiting algorithms that stay correct across multiple server instances."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
loadtest = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/distributed_rate_limiter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Put src/ on sys.path directly rather than relying on the editable install's
# .pth file. On macOS that .pth can acquire the UF_HIDDEN flag, and Python
# 3.13's site.py silently skips hidden .pth files -- which breaks the import
# with no diagnostic. This keeps the suite runnable either way.
pythonpath = ["src", "."]
